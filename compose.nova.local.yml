# Explicit local override; never loaded by plain `docker compose up`.
services:
  backend:
    environment:
      PARSE_PROVIDER: bedrock
      PARSE_BEDROCK_API: converse
      PARSE_REGION: eu-north-1
      PARSE_BEDROCK_ENABLED: 'true'
      PARSER_MODEL: eu.amazon.nova-2-lite-v1:0
      AWS_PROFILE: default
      AWS_SHARED_CREDENTIALS_FILE: /run/lab6-aws/credentials
      AWS_CONFIG_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
    volumes:
      - type: bind
        source: ${NOVA_AWS_CREDENTIALS_DIR:?Run scripts/prepare_nova_credentials.py first}
        target: /run/lab6-aws
        read_only: true
        bind:
          create_host_path: false
